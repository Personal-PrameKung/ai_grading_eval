[project]
name = "rubric-generater"
version = "0.1.0"
description = "Batch PDF rubric generation using graderai's existing agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.27.0",
    "logfire>=2.0.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[openai]>=0.0.39",
    "sqlalchemy>=2.0.0",
    "PyMuPDF>=1.26.0",
]
