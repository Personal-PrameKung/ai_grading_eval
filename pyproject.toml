[project]
name = "ai-eval"
version = "0.1.0"
description = "Reproducible evaluation pipeline for AI grading of student math responses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.0",
    "pydantic-evals>=2.37.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ai-grading-eval = "ai_grading_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_grading_eval"]
